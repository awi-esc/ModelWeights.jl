name: Tests

on:
  push:
    branches:
      - main
      - dev
    tags: '*'
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.version }}
    # These permissions are needed to delete old caches: https://github.com/julia-actions/cache#usage
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12' # minimum supported version (compat in Project.toml)
          - '1'    # latest stable release
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
